{% extends "base.html" %}

{% block title %}تعديل فئة - نظام إدارة المخزن{% endblock %}

{% block header %}تعديل فئة: {{ category.name }}{% endblock %}

{% block header_buttons %}
<a href="{{ url_for('categories') }}" class="btn btn-sm btn-secondary">
    <i class="fas fa-arrow-right"></i> العودة للفئات
</a>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-body">
                <form method="POST" action="{{ url_for('edit_category', id=category.id) }}">
                    {{ form.hidden_tag() }}
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <div class="mb-3">
                                <label for="name" class="form-label">اسم الفئة</label>
                                <input type="text" class="form-control" id="name" name="name" value="{{ category.name }}" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <div class="mb-3">
                                <label for="description" class="form-label">الوصف</label>
                                <textarea class="form-control" id="description" name="description" rows="3">{{ category.description }}</textarea>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('categories') }}" class="btn btn-secondary me-md-2">إلغاء</a>
                        <button type="submit" class="btn btn-primary">حفظ التغييرات</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
